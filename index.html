<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d');
var P=[[.55,.55,1,.075,.10],[.40,.62,.62,.07,.09],[.72,.52,.78,.08,.10],[.28,.50,.45,.07,.08],[.64,.30,.42,.07,.07],[.86,.40,.55,.07,.09],[.47,.28,.38,.06,.06],[.98,.62,.5,.08,.1],[.18,.70,.3,.07,.08]];
function H(u,v){var h=0;for(var i=0;i<P.length;i++){var p=P[i],dx=(u-p[0])/p[3],dz=(v-p[1])/p[4];h+=p[2]*Math.exp(-Math.pow(dx*dx+dz*dz,.72)*.62)*(1+.06*Math.sin(u*40+v*23));}
 var r=Math.sin(u*31)*Math.cos(v*27)*.025+Math.sin(u*73+v*41)*.01;return Math.max(0,h+r*(h>.05?1:.3));}
function draw(){
 var d=Math.min(window.devicePixelRatio||1,2),W=c.clientWidth,Ht=c.clientHeight;if(!W||!Ht)return;
 c.width=W*d;c.height=Ht*d;x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,Ht);
 var narrow=window.innerWidth<=820;
 var S=Math.min(W*1.0,Ht*1.25),cx=W*(narrow?.5:.56),hy=Ht*(narrow?.46:.50);
 function pr(u,v,h){var z=.75+v*2.3;return[cx+(u-.5)*S*1.9/z,hy+(.34-h*.62)*S/z];}
 // sun
 var sx=cx+S*.02,sy=hy-S*.22,sr=S*.085;
 x.save();x.shadowColor='rgba(200,18,31,.8)';x.shadowBlur=S*.08;
 var g=x.createRadialGradient(sx,sy-sr*.4,sr*.1,sx,sy,sr);g.addColorStop(0,'#e8202e');g.addColorStop(1,'#8f0a16');x.fillStyle=g;
 x.beginPath();x.arc(sx,sy,sr,0,7);x.fill();x.restore();
 x.fillStyle='#0A0A0A';for(var k=0;k<6;k++){var yy=sy+sr*(.18+k*.15),th=sr*(.02+k*.018);x.fillRect(sx-sr-2,yy,sr*2+4,th);}
 x.strokeStyle='rgba(255,70,70,.28)';x.lineWidth=1;for(k=0;k<6;k++){var y2=sy+sr*(.27+k*.15);x.beginPath();x.moveTo(sx-sr*1.3,y2);x.lineTo(sx+sr*1.3,y2);x.stroke();}
 // mesh
 var NU=narrow?130:190,NV=narrow?50:70,G=[],i,j;
 for(j=0;j<=NV;j++){G[j]=[];for(i=0;i<=NU;i++){var u=-.7+2.4*i/NU,v=j/NV;G[j][i]=pr(u,v,H(u,v));G[j][i][2]=H(u,v);}}
 x.lineJoin='round';
 for(j=NV-1;j>=0;j--){
  var A=G[j+1],B=G[j],fade=Math.min(1,(NV-j+1)/12);
  x.fillStyle='rgba(10,10,10,.93)';x.beginPath();x.moveTo(A[0][0],A[0][1]);
  for(i=1;i<=NU;i++)x.lineTo(A[i][0],A[i][1]);for(i=NU;i>=0;i--)x.lineTo(B[i][0],B[i][1]);x.closePath();x.fill();
  for(i=0;i<NU;i++){
   var h=(A[i][2]+A[i+1][2]+B[i][2])/3,a=(.16+Math.min(1,h*1.6)*.84)*fade,l=Math.round(30+Math.min(1,h)*35);
   x.strokeStyle='hsla(355,90%,'+l+'%,'+a.toFixed(3)+')';x.lineWidth=.45+h*.6;
   x.beginPath();x.moveTo(A[i][0],A[i][1]);x.lineTo(A[i+1][0],A[i+1][1]);x.moveTo(A[i][0],A[i][1]);x.lineTo(B[i][0],B[i][1]);x.stroke();}
 }
 // glow pass
 var o=document.createElement('canvas');o.width=c.width;o.height=c.height;o.getContext('2d').drawImage(c,0,0);
 x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='lighter';x.filter='blur('+(5*d)+'px)';x.globalAlpha=.5;x.drawImage(o,0,0);x.restore();
 // chart line
 var pts=[[.0,.62],[.1,.52],[.2,.55],[.3,.40],[.38,.44],[.47,.30],[.55,.33],[.63,.20],[.70,.24],[.80,.12],[.88,.13],[1,0]];
 var x0=cx-S*(narrow?.46:.40),x1=cx+S*.40,y0=hy+S*.03,y1=hy-S*.36;
 x.save();x.shadowColor='rgba(255,40,50,.95)';x.shadowBlur=12;x.strokeStyle='#ff4d4f';x.lineWidth=1.6;x.beginPath();
 var q=pts.map(function(p){return[x0+(x1-x0)*p[0],y0+(y1-y0)*(1-p[1]/.62)];});
 x.moveTo(q[0][0],q[0][1]);for(i=1;i<q.length;i++){var m=[(q[i-1][0]+q[i][0])/2,(q[i-1][1]+q[i][1])/2];x.quadraticCurveTo(q[i-1][0],q[i-1][1],m[0],m[1]);}x.lineTo(q[q.length-1][0],q[q.length-1][1]);x.stroke();
 x.fillStyle='#ff5a5c';[q[0],q[q.length-1]].forEach(function(p){x.beginPath();x.arc(p[0],p[1],3,0,7);x.fill();});x.restore();
}
var t;window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(draw,120);});draw();
})();
